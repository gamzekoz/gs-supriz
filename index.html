<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Seni Seviyorum 💖</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>

    <!-- Kalpler -->
    <div class="hearts">
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>
        <span>💓</span>
        <span>💖</span>
        <span>💗</span>
        <span>💞</span>
        <span>💓</span>
    </div>

    <!-- Yazı -->
    <div class="container">
        <h1>SENİ ÇOOOOOOOOK AMA ÇOOOOKKK SEVİYORUM HAYATIMIN ANLAMI💗 </h1>
        <p>İYİ Kİ VARSIN ❤️</p>
    </div>

    <button onclick="playMusic()" class="music-btn">
    🎶 Şarkıyı Başlat
</button>

<audio id="bgMusic" loop>
    <source src="music.mp3.mp3" type="audio/mpeg">
</audio>

<script>
let isPlaying = false;

function playMusic() {
    const music = document.getElementById("bgMusic");

    if (isPlaying) {
        music.pause();
        isPlaying = false;
    } else {
        music.play();
        isPlaying = true;
    }
}
</script>
</body>
</html>
